# 预印本 - Preprints

- type: preprint
  title: "Continuity of solutions to complex Hessian equations on compact Hermitian manifolds"
  authors: Y. Fang
  archive: "arXiv preprint"
  year: 2025
  arxiv: "2510.14690"
  abstract: >
    Let $(X,\omega)$ be a compact Hermitian manifold of dimension $n$. 
    We derive an $L^{\infty}$-estimate for bounded solutions to the complex 
    $m$-th Hessian equations on $X$, assuming a positive right-hand side in 
    the Orlicz space $L^{\frac{n}{m}}(\log L)^n(h\circ\log \circ \log L)^n$, 
    where the associated weight satisfies Kołodziej's Condition. Building upon 
    this estimate, we then establish the existence of continuous solutions to 
    the complex Hessian equation under the prescribed assumptions.
  status: "Accepted for publication in Indiana Univ. Math. J. "

- type: preprint
  title: "Smoothness of bounded solutions to complex Hessian equations on compact Hermitian manifolds"
  authors: Y. Fang
  archive: "arXiv preprint"
  year: 2026
  arxiv: "2610.06719"
  abstract: >
    We establish an a priori $C^2$-estimate for complex Hessian equations on compact Hermitian manifolds. As an application, we obtain a regularity result for solutions to complex Hessian equation with densities of the right hand side depending on the solution. This generalizes Székelyhidi--Tosatti's result to the setting of complex Hessian equations on Hermitian manifolds.
  status: ". "


# 期刊文章 - Publications

- type: "journal"
  title: "Integrability of $(\\omega, m)$-subharmonic functions on compact Hermitian manifolds"
  authors: "Y. Fang"
  journal: "Ann. Polon. Math."
  year: 2026
  volume: "136"
  issue: "3"
  pages: "261–274"
  arxiv: "2503.19678"
  doi: "10.4064/ap250407-17-9"
  abstract: >
    Let $(X, \omega)$ be a compact Hermitian manifold of dimension $n$. 
    We show that all $(\omega ,m)$-subharmonic functions are $L^p$-integrable 
    on $X$, for any $ p < \frac{n}{n-m}$.